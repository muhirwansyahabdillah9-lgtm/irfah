          import 'dart:math' as math;

          import 'package:flutter/material.dart';

          double _c01(double v) => v < 0 ? 0 : (v > 1 ? 1 : v);

          /// Logo Irfah: matahari terbit di atas ombak.
          class LogoPainter extends CustomPainter {
            final double t;
            LogoPainter(this.t);

            @override
            void paint(Canvas c, Size s) {
              final r = s.width / 2;
              final disc = Rect.fromCircle(center: Offset(r, r), radius: r);
              c.drawCircle(Offset(r, r), r, Paint()..color = const Color(0xFF1B2440));
              c.save();
              c.clipPath(Path()..addOval(disc));
              final sunC = Offset(r, r * (1.5 - 0.6 * t));
              c.drawCircle(
                sunC,
                r * .5,
                Paint()
                  ..shader = const RadialGradient(
                          colors: [Color(0xFFFFC857), Color(0xFFFF6B35)])
                      .createShader(Rect.fromCircle(center: sunC, radius: r * .5)),
              );
              final wave = Paint()
                ..color = const Color(0xFF4FC3F7)
                ..style = PaintingStyle.stroke
                ..strokeWidth = r * .08
                ..strokeCap = StrokeCap.round;
              for (int i = 0; i < 3; i++) {
                final y = r * (1.15 + i * .28);
                final p = Path()..moveTo(0, y);
                for (double x = 0; x <= s.width; x += 4) {
                  p.lineTo(x, y + math.sin(x / s.width * 4 * math.pi + t * 6 + i) * r * .05);
                }
                c.drawPath(p, wave);
              }
              c.restore();
            }

            @override
            bool shouldRepaint(LogoPainter o) => o.t != t;
          }

