name: Bangun APK Irfah

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tulis kode Irfah
        run: |
          mkdir -p lib
          cat > pubspec.yaml <<'DART_EOF'
          name: irfah
          description: Irfah, pemutar musik untuk HP.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.3.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.40
            just_audio_background: ^0.0.1-beta.13
            audio_session: ^0.1.21
            http: ^1.2.2
            shared_preferences: ^2.3.2
            path_provider: ^2.1.4
            file_picker: ^8.1.2

          flutter:
            uses-material-design: true
          DART_EOF
          cat > lib/main.dart <<'DART_EOF'
          import 'dart:ui' show ImageFilter;

          import 'package:flutter/material.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:just_audio_background/just_audio_background.dart';

          import 'pages.dart';
          import 'player_page.dart';
          import 'splash.dart';
          import 'state.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await JustAudioBackground.init(
              androidNotificationChannelId: 'com.irfah.audio',
              androidNotificationChannelName: 'Irfah',
              androidNotificationOngoing: true,
            );
            final st = AppState();
            await st.init();
            runApp(IrfahApp(st));
          }

          ThemeData buildTheme(AppState st, Brightness sys) {
            final glass = st.style == 'glass';
            final h = (st.current == null ? 222 : hueOf(st.current!.id)).toDouble();
            final seed = HSLColor.fromAHSL(1, h, .68, .5).toColor();
            final b = glass ? Brightness.dark : sys;
            final cs = ColorScheme.fromSeed(seedColor: seed, brightness: b);
            return ThemeData(
              useMaterial3: true,
              colorScheme: cs,
              scaffoldBackgroundColor: glass
                  ? Colors.transparent
                  : (b == Brightness.dark ? const Color(0xFF17171A) : const Color(0xFFF4F2ED)),
              navigationBarTheme: NavigationBarThemeData(
                backgroundColor: glass ? Colors.transparent : null,
                indicatorColor: cs.primary.withAlpha(70),
              ),
            );
          }

          class IrfahApp extends StatelessWidget {
            final AppState st;
            const IrfahApp(this.st, {super.key});

            @override
            Widget build(BuildContext context) {
              return ListenableBuilder(
                listenable: st,
                builder: (context, _) => MaterialApp(
                  title: 'Irfah',
                  debugShowCheckedModeBanner: false,
                  scaffoldMessengerKey: messengerKey,
                  theme: buildTheme(st, Brightness.light),
                  darkTheme: buildTheme(st, Brightness.dark),
                  themeMode: ThemeMode.system,
                  themeAnimationDuration: const Duration(milliseconds: 700),
                  home: SplashPage(next: Shell(st)),
                ),
              );
            }
          }

          class Shell extends StatelessWidget {
            final AppState st;
            const Shell(this.st, {super.key});

            @override
            Widget build(BuildContext context) {
              final glass = st.style == 'glass';
              final pages = <Widget>[
                HomePage(st),
                ExplorePage(st),
                LibraryPage(st),
                MePage(st),
              ];
              Widget nav = NavigationBar(
                selectedIndex: st.tab,
                onDestinationSelected: st.setTab,
                destinations: const [
                  NavigationDestination(
                      icon: Icon(Icons.home_outlined), selectedIcon: Icon(Icons.home), label: 'Beranda'),
                  NavigationDestination(
                      icon: Icon(Icons.search), selectedIcon: Icon(Icons.search), label: 'Cari'),
                  NavigationDestination(
                      icon: Icon(Icons.library_music_outlined),
                      selectedIcon: Icon(Icons.library_music),
                      label: 'Pustaka'),
                  NavigationDestination(
                      icon: Icon(Icons.person_outline), selectedIcon: Icon(Icons.person), label: 'Kamu'),
                ],
              );
              if (glass) {
                nav = Padding(
                  padding: const EdgeInsets.fromLTRB(12, 0, 12, 10),
                  child: ClipRRect(
                    borderRadius: BorderRadius.circular(34),
                    child: BackdropFilter(
                      filter: ImageFilter.blur(sigmaX: 26, sigmaY: 26),
                      child: Container(
                        decoration: BoxDecoration(
                          borderRadius: BorderRadius.circular(34),
                          border: Border.all(color: Colors.white.withAlpha(80)),
                          gradient: LinearGradient(
                            begin: Alignment.topLeft,
                            end: Alignment.bottomRight,
                            colors: [Colors.white.withAlpha(60), Colors.white.withAlpha(18)],
                          ),
                        ),
                        child: LensNav(index: st.tab, onChanged: st.setTab),
                      ),
                    ),
                  ),
                );
              }
              return Backdrop(
                st: st,
                child: Scaffold(
                  backgroundColor: Colors.transparent,
                  appBar: AppBar(
                    backgroundColor: Colors.transparent,
                    titleSpacing: 16,
                    title: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Text('Irfah', style: head(st, 22)),
                      const Text('Pemutar musik untuk HP', style: TextStyle(fontSize: 11)),
                    ]),
                    actions: [
                      IconButton(
                        icon: const Icon(Icons.settings_outlined),
                        tooltip: 'Pengaturan',
                        onPressed: () => Navigator.of(context)
                            .push(MaterialPageRoute(builder: (_) => SettingsPage(st))),
                      ),
                    ],
                  ),
                  body: pages[st.tab],
                  bottomNavigationBar: Column(mainAxisSize: MainAxisSize.min, children: [
                    if (st.current != null) MiniPlayer(st),
                    nav,
                  ]),
                ),
              );
            }
          }

          class MiniPlayer extends StatelessWidget {
            final AppState st;
            const MiniPlayer(this.st, {super.key});

            @override
            Widget build(BuildContext context) {
              final s = st.current!;
              final glass = st.style == 'glass';
              return GestureDetector(
                onTap: () => openPlayer(context, st),
                child: Padding(
                  padding: const EdgeInsets.fromLTRB(12, 0, 12, 8),
                  child: Glass(
                    st: st,
                    radius: 24,
                    padding: const EdgeInsets.all(8),
                    child: Row(children: [
                      Cover(s: s, size: 46, radius: glass ? 12 : 3),
                      const SizedBox(width: 10),
                      Expanded(
                        child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                          Text(s.title,
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: const TextStyle(fontWeight: FontWeight.w700)),
                          Text(s.artist.isEmpty ? '—' : s.artist,
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: const TextStyle(fontSize: 12)),
                        ]),
                      ),
                      StreamBuilder<PlayerState>(
                        stream: st.player.playerStateStream,
                        builder: (context, snap) {
                          final playing = snap.data?.playing ?? false;
                          return IconButton(
                            icon: Icon(playing ? Icons.pause : Icons.play_arrow),
                            onPressed: () => st.togglePlay(),
                          );
                        },
                      ),
                      IconButton(icon: const Icon(Icons.skip_next), onPressed: () => st.next()),
                    ]),
                  ),
                ),
              );
            }
          }

          /// Navbar kaca dengan lensa yang bisa digeser; saat ditahan lensanya membesar.
          class LensNav extends StatefulWidget {
            final int index;
            final ValueChanged<int> onChanged;
            const LensNav({super.key, required this.index, required this.onChanged});

            @override
            State<LensNav> createState() => _LensNavState();
          }

          class _LensNavState extends State<LensNav> {
            bool hold = false;
            double? dragX;

            static const _icons = [
              Icons.home_rounded,
              Icons.search_rounded,
              Icons.library_music_rounded,
              Icons.person_rounded,
            ];
            static const _labels = ['Beranda', 'Cari', 'Pustaka', 'Kamu'];

            @override
            Widget build(BuildContext context) {
              final onSurface = Theme.of(context).colorScheme.onSurface;
              return LayoutBuilder(builder: (context, box) {
                final w = box.maxWidth;
                final slot = w / 4;
                final left = dragX != null
                    ? (dragX! - slot / 2).clamp(0.0, w - slot).toDouble()
                    : widget.index * slot;
                final hot = ((left + slot / 2) / slot).floor().clamp(0, 3).toInt();
                void release() {
                  final i = dragX != null ? hot : widget.index;
                  setState(() {
                    hold = false;
                    dragX = null;
                  });
                  widget.onChanged(i);
                }

                return GestureDetector(
                  behavior: HitTestBehavior.opaque,
                  onTapDown: (d) => setState(() {
                    hold = true;
                    dragX = d.localPosition.dx;
                  }),
                  onTapUp: (_) => release(),
                  onTapCancel: () => setState(() {
                    hold = false;
                    dragX = null;
                  }),
                  onHorizontalDragStart: (d) => setState(() {
                    hold = true;
                    dragX = d.localPosition.dx;
                  }),
                  onHorizontalDragUpdate: (d) => setState(() => dragX = d.localPosition.dx),
                  onHorizontalDragEnd: (_) => release(),
                  onHorizontalDragCancel: () => setState(() {
                    hold = false;
                    dragX = null;
                  }),
                  child: SizedBox(
                    height: 66,
                    child: Stack(children: [
                      AnimatedPositioned(
                        duration: Duration(milliseconds: dragX != null ? 70 : 380),
                        curve: Curves.easeOutBack,
                        left: left,
                        top: 5,
                        bottom: 5,
                        width: slot,
                        child: AnimatedScale(
                          scale: hold ? 1.18 : 1.0,
                          duration: const Duration(milliseconds: 200),
                          curve: Curves.easeOut,
                          child: Container(
                            decoration: BoxDecoration(
                              borderRadius: BorderRadius.circular(30),
                              color: Colors.white.withAlpha(hold ? 90 : 55),
                              border: Border.all(color: Colors.white.withAlpha(140)),
                              boxShadow: [
                                BoxShadow(
                                    color: Colors.black.withAlpha(hold ? 70 : 35),
                                    blurRadius: hold ? 24 : 12,
                                    offset: const Offset(0, 6)),
                              ],
                            ),
                          ),
                        ),
                      ),
                      Positioned.fill(
                        child: Row(children: [
                          for (int i = 0; i < 4; i++)
                            Expanded(
                              child: AnimatedScale(
                                scale: (hold && i == hot) ? 1.22 : 1.0,
                                duration: const Duration(milliseconds: 200),
                                child: Column(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: [
                                      Icon(_icons[i],
                                          size: 24,
                                          color: onSurface.withAlpha(i == hot ? 255 : 170)),
                                      const SizedBox(height: 2),
                                      Text(_labels[i],
                                          style: TextStyle(
                                              fontSize: 11,
                                              fontWeight: i == hot ? FontWeight.w800 : FontWeight.w500,
                                              color: onSurface.withAlpha(i == hot ? 255 : 170))),
                                    ]),
                              ),
                            ),
                        ]),
                      ),
                    ]),
                  ),
                );
              });
            }
          }
          DART_EOF
          cat > lib/state.dart <<'DART_EOF'
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';

          import 'package:audio_session/audio_session.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;
          import 'package:just_audio/just_audio.dart';
          import 'package:just_audio_background/just_audio_background.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          final GlobalKey<ScaffoldMessengerState> messengerKey =
              GlobalKey<ScaffoldMessengerState>();

          int hueOf(String s) {
            int h = 0;
            for (final c in s.codeUnits) {
              h = (h * 31 + c) % 360;
            }
            return h;
          }

          String fmt(Duration d) {
            final m = d.inMinutes;
            final s = d.inSeconds % 60;
            return '$m:${s.toString().padLeft(2, '0')}';
          }

          class Song {
            final String id;
            final String title;
            final String artist;
            final String album;
            final String? art;
            final String? url;
            final String? path;
            final int durationSec;

            Song({
              required this.id,
              required this.title,
              this.artist = '',
              this.album = '',
              this.art,
              this.url,
              this.path,
              this.durationSec = 0,
            });

            bool get isLocal => path != null;

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'title': title,
                  'artist': artist,
                  'album': album,
                  'art': art,
                  'url': url,
                  'path': path,
                  'dur': durationSec,
                };

            factory Song.fromJson(Map<String, dynamic> j) => Song(
                  id: j['id'] as String,
                  title: j['title'] as String,
                  artist: (j['artist'] as String?) ?? '',
                  album: (j['album'] as String?) ?? '',
                  art: j['art'] as String?,
                  url: j['url'] as String?,
                  path: j['path'] as String?,
                  durationSec: (j['dur'] as num?)?.toInt() ?? 0,
                );
          }

          class LyricLine {
            final Duration t;
            final String text;
            LyricLine(this.t, this.text);
          }

          List<LyricLine> parseLrc(String s) {
            final re = RegExp(r'\[(\d+):(\d+(?:\.\d+)?)\]');
            final out = <LyricLine>[];
            for (final raw in s.split(RegExp(r'\r?\n'))) {
              final ms = re.allMatches(raw).toList();
              if (ms.isEmpty) continue;
              final text = raw.replaceAll(RegExp(r'\[[^\]]*\]'), '').trim();
              for (final m in ms) {
                final sec = int.parse(m.group(1)!) * 60 + double.parse(m.group(2)!);
                out.add(LyricLine(Duration(milliseconds: (sec * 1000).round()), text));
              }
            }
            out.sort((a, b) => a.t.compareTo(b.t));
            return out;
          }

          class Api {
            /// Katalog musik berlisensi bebas dari Jamendo (perlu Client ID gratis).
            static Future<List<Song>> jamendo(
              String clientId, {
              String? search,
              String? tag,
              String order = 'popularity_week',
              int limit = 30,
              int offset = 0,
            }) async {
              final q = <String, String>{
                'client_id': clientId,
                'format': 'json',
                'limit': '$limit',
                'offset': '$offset',
                'include': 'musicinfo',
                'audioformat': 'mp32',
                'imagesize': '400',
                'order': order,
              };
              if (search != null && search.trim().isNotEmpty) q['search'] = search.trim();
              if (tag != null && tag.isNotEmpty) q['tags'] = tag;
              final r = await http
                  .get(Uri.https('api.jamendo.com', '/v3.0/tracks/', q))
                  .timeout(const Duration(seconds: 15));
              if (r.statusCode != 200) throw Exception('HTTP ${r.statusCode}');
              final j = jsonDecode(utf8.decode(r.bodyBytes));
              final res = (j['results'] as List?) ?? [];
              final out = <Song>[];
              for (final e in res) {
                final url = e['audio'] as String?;
                if (url == null || url.isEmpty) continue;
                out.add(Song(
                  id: 'jm:${e['id']}',
                  title: '${e['name']}',
                  artist: '${e['artist_name'] ?? ''}',
                  album: '${e['album_name'] ?? ''}',
                  art: (e['image'] ?? e['album_image']) as String?,
                  url: url,
                  durationSec: (e['duration'] as num?)?.toInt() ?? 0,
                ));
              }
              return out;
            }

            /// Lirik dari LRCLIB (gratis, tanpa kunci). Mengembalikan teks LRC atau teks biasa.
            static Future<String?> lyrics(Song s) async {
              const headers = {'User-Agent': 'Irfah/1.0'};
              if (s.artist.isNotEmpty) {
                final q = <String, String>{
                  'track_name': s.title,
                  'artist_name': s.artist,
                };
                if (s.album.isNotEmpty) q['album_name'] = s.album;
                if (s.durationSec > 0) q['duration'] = '${s.durationSec}';
                final r = await http
                    .get(Uri.https('lrclib.net', '/api/get', q), headers: headers)
                    .timeout(const Duration(seconds: 10));
                if (r.statusCode == 200) {
                  final j = jsonDecode(utf8.decode(r.bodyBytes));
                  final syn = j['syncedLyrics'] as String?;
                  final pl = j['plainLyrics'] as String?;
                  if (syn != null && syn.isNotEmpty) return syn;
                  if (pl != null && pl.isNotEmpty) return pl;
                }
              }
              final q2 = s.artist.isNotEmpty
                  ? {'track_name': s.title, 'artist_name': s.artist}
                  : {'q': s.title};
              final r2 = await http
                  .get(Uri.https('lrclib.net', '/api/search', q2), headers: headers)
                  .timeout(const Duration(seconds: 10));
              if (r2.statusCode == 200) {
                final l = jsonDecode(utf8.decode(r2.bodyBytes)) as List;
                for (final j in l) {
                  final syn = j['syncedLyrics'];
                  if (syn is String && syn.isNotEmpty) return syn;
                }
                for (final j in l) {
                  final pl = j['plainLyrics'];
                  if (pl is String && pl.isNotEmpty) return pl;
                }
              }
              return null;
            }
          }

          class AppState extends ChangeNotifier {
            late SharedPreferences prefs;
            final AudioPlayer player = AudioPlayer();
            final Random _rnd = Random();

            String style = 'glass';
            String jamendoId = '';
            bool endless = true;
            bool shuffle = false;
            int repeat = 0; // 0 mati, 1 semua, 2 satu lagu
            int tab = 0;

            List<Song> library = [];
            List<Song> favs = [];
            List<Song> recents = [];
            List<Song> queue = [];
            List<Song> trending = [];
            Map<String, int> plays = {};
            List<String> days = [];
            int index = -1;

            int sleepMin = 0;
            Timer? _sleep;

            List<LyricLine> lyr = [];
            String? plainLyr;
            bool lyrLoading = false;
            String lyrMsg = '';

            List<Song> results = [];
            bool searching = false;
            String exploreMsg = '';
            String? activeTag;
            String query = '';
            final Set<String> downloading = {};

            Song? get current =>
                (index >= 0 && index < queue.length) ? queue[index] : null;

            void say(String m) {
              messengerKey.currentState
                ?..hideCurrentSnackBar()
                ..showSnackBar(SnackBar(content: Text(m)));
            }

            Future<void> init() async {
              prefs = await SharedPreferences.getInstance();
              style = prefs.getString('style') ?? 'glass';
              jamendoId = prefs.getString('jid') ?? '';
              endless = prefs.getBool('endless') ?? true;
              shuffle = prefs.getBool('shuf') ?? false;
              repeat = prefs.getInt('rep') ?? 0;
              days = prefs.getStringList('days') ?? [];
              library = _list('lib');
              favs = _list('favs');
              recents = _list('rec');
              try {
                plays = Map<String, int>.from(
                    jsonDecode(prefs.getString('plays') ?? '{}') as Map);
              } catch (_) {}

              final session = await AudioSession.instance;
              await session.configure(const AudioSessionConfiguration.music());
              player.processingStateStream.listen((ps) {
                if (ps == ProcessingState.completed) _onEnded();
              });
              player.playerStateStream.listen((_) => notifyListeners());
              Timer.periodic(const Duration(seconds: 5), (_) {
                if (player.playing) prefs.setInt('qpos', player.position.inMilliseconds);
              });

              queue = _list('queue');
              index = prefs.getInt('qi') ?? -1;
              if (index >= 0 && index < queue.length) {
                await _load(index,
                    play: false,
                    restorePos: Duration(milliseconds: prefs.getInt('qpos') ?? 0));
              } else {
                index = -1;
              }
              if (jamendoId.isNotEmpty) loadTrending();
            }

            List<Song> _list(String key) {
              final s = prefs.getString(key);
              if (s == null) return [];
              try {
                return (jsonDecode(s) as List)
                    .map((e) => Song.fromJson(Map<String, dynamic>.from(e as Map)))
                    .toList();
              } catch (_) {
                return [];
              }
            }

            void _saveList(String key, List<Song> l) {
              prefs.setString(key, jsonEncode(l.map((e) => e.toJson()).toList()));
            }

            // ---------- pengaturan ----------
            void setTab(int i) {
              tab = i;
              notifyListeners();
            }

            void setStyle(String s) {
              style = s;
              prefs.setString('style', s);
              notifyListeners();
            }

            void setEndless(bool v) {
              endless = v;
              prefs.setBool('endless', v);
              notifyListeners();
            }

            void setJamendo(String id) {
              jamendoId = id.trim();
              prefs.setString('jid', jamendoId);
              trending = [];
              results = [];
              notifyListeners();
              if (jamendoId.isNotEmpty) loadTrending();
            }

            // ---------- pemutaran ----------
            Future<void> playQueue(List<Song> q, int i) async {
              if (q.isEmpty || i < 0 || i >= q.length) return;
              queue = List.of(q);
              await _load(i);
            }

            Future<void> _load(int i, {bool play = true, Duration? restorePos}) async {
              index = i;
              final s = queue[i];
              final uri = s.isLocal ? Uri.file(s.path!) : Uri.parse(s.url!);
              final tag = MediaItem(
                id: s.id,
                title: s.title,
                artist: s.artist,
                album: s.album,
                artUri: s.art != null ? Uri.parse(s.art!) : null,
              );
              try {
                await player.setAudioSource(AudioSource.uri(uri, tag: tag),
                    initialPosition: restorePos);
              } catch (e) {
                say('Gagal memutar: ${s.title}');
                notifyListeners();
                return;
              }
              if (play) {
                plays[s.id] = (plays[s.id] ?? 0) + 1;
                _markToday();
                _pushRecent(s);
                unawaited(player.play());
              }
              _saveQueue();
              loadLyrics(s);
              notifyListeners();
            }

            void _saveQueue() {
              _saveList('queue', queue);
              prefs.setInt('qi', index);
            }

            void _pushRecent(Song s) {
              recents.removeWhere((e) => e.id == s.id);
              recents.insert(0, s);
              if (recents.length > 40) recents = recents.sublist(0, 40);
              _saveList('rec', recents);
              prefs.setString('plays', jsonEncode(plays));
            }

            void _onEnded() {
              if (repeat == 2) {
                player.seek(Duration.zero);
                player.play();
                return;
              }
              next(auto: true);
            }

            Future<void> next({bool auto = false}) async {
              if (queue.isEmpty) return;
              if (shuffle && queue.length > 1) {
                int n;
                do {
                  n = _rnd.nextInt(queue.length);
                } while (n == index);
                await _load(n);
                return;
              }
              if (index < queue.length - 1) {
                await _load(index + 1);
                return;
              }
              if (repeat == 1) {
                await _load(0);
                return;
              }
              if (auto && endless) {
                await _endless();
                return;
              }
              if (auto) {
                await player.pause();
                await player.seek(Duration.zero);
              }
            }

            Future<void> _endless() async {
              List<Song> more = [];
              if (jamendoId.isNotEmpty) {
                try {
                  more = await Api.jamendo(jamendoId,
                      order: 'popularity_week', limit: 20, offset: _rnd.nextInt(100));
                } catch (_) {}
              }
              if (more.isEmpty) more = [...library, ...favs];
              more = more.where((s) => !queue.any((q) => q.id == s.id)).toList();
              if (more.isEmpty) {
                await player.pause();
                return;
              }
              more.shuffle(_rnd);
              queue.addAll(more.take(10));
              await _load(index + 1);
            }

            Future<void> prev() async {
              if (player.position.inSeconds > 3) {
                await player.seek(Duration.zero);
                return;
              }
              if (index > 0) {
                await _load(index - 1);
              } else {
                await player.seek(Duration.zero);
              }
            }

            void togglePlay() {
              if (player.playing) {
                player.pause();
              } else {
                player.play();
              }
            }

            void toggleShuffle() {
              shuffle = !shuffle;
              prefs.setBool('shuf', shuffle);
              notifyListeners();
            }

            void cycleRepeat() {
              repeat = (repeat + 1) % 3;
              prefs.setInt('rep', repeat);
              notifyListeners();
            }

            void addToQueue(Song s) {
              if (queue.isEmpty || current == null) {
                playQueue([s], 0);
                return;
              }
              queue.add(s);
              _saveQueue();
              say('Ditambahkan ke antrean');
              notifyListeners();
            }

            void setSleep(int m) {
              _sleep?.cancel();
              sleepMin = m;
              if (m > 0) {
                _sleep = Timer(Duration(minutes: m), () {
                  player.pause();
                  sleepMin = 0;
                  notifyListeners();
                });
                say('Musik berhenti otomatis dalam $m menit');
              }
              notifyListeners();
            }

            // ---------- favorit dan statistik ----------
            bool isFav(Song s) => favs.any((f) => f.id == s.id);

            void toggleFav(Song s) {
              if (isFav(s)) {
                favs.removeWhere((f) => f.id == s.id);
              } else {
                favs.insert(0, s);
              }
              _saveList('favs', favs);
              notifyListeners();
            }

            String _fmtDay(DateTime d) => d.toIso8601String().substring(0, 10);

            void _markToday() {
              final t = _fmtDay(DateTime.now());
              if (!days.contains(t)) {
                days.add(t);
                prefs.setStringList('days', days);
              }
            }

            /// Jumlah hari berturut-turut mendengarkan (hari ini atau kemarin sebagai awal).
            int get streak {
              var d = DateTime.now();
              if (!days.contains(_fmtDay(d))) d = d.subtract(const Duration(days: 1));
              int n = 0;
              while (days.contains(_fmtDay(d))) {
                n++;
                d = d.subtract(const Duration(days: 1));
              }
              return n;
            }

            int get totalPlays => plays.values.fold(0, (a, b) => a + b);

            List<Song> topSongs() {
              final all = <String, Song>{};
              for (final s in [...library, ...favs, ...recents]) {
                all[s.id] = s;
              }
              final l = all.values.where((s) => (plays[s.id] ?? 0) > 0).toList();
              l.sort((a, b) => (plays[b.id] ?? 0).compareTo(plays[a.id] ?? 0));
              return l.take(30).toList();
            }

            // ---------- pustaka di HP ----------
            Future<Directory> _musicDir() async {
              final d = await getApplicationDocumentsDirectory();
              final m = Directory('${d.path}/music');
              if (!await m.exists()) await m.create(recursive: true);
              return m;
            }

            Future<void> importLocal() async {
              final r = await FilePicker.platform
                  .pickFiles(type: FileType.audio, allowMultiple: true);
              if (r == null) return;
              final dir = await _musicDir();
              int n = 0;
              for (final f in r.files) {
                final p = f.path;
                if (p == null) continue;
                final id = 'local:${f.name}:${f.size}';
                if (library.any((s) => s.id == id)) continue;
                final dest = File(
                    '${dir.path}/${DateTime.now().microsecondsSinceEpoch}_${f.name}');
                await File(p).copy(dest.path);
                final dot = f.name.lastIndexOf('.');
                final base = dot > 0 ? f.name.substring(0, dot) : f.name;
                final parts = base.split(' - ');
                final artist = parts.length >= 2 ? parts[0].trim() : '';
                final title = parts.length >= 2 ? parts.sublist(1).join(' - ').trim() : base;
                library.add(Song(id: id, title: title, artist: artist, path: dest.path));
                n++;
              }
              _saveList('lib', library);
              say(n == 0 ? 'Tidak ada lagu baru.' : '$n lagu ditambahkan.');
              notifyListeners();
            }

            Future<void> removeLocal(Song s) async {
              try {
                if (s.path != null) {
                  final f = File(s.path!);
                  if (await f.exists()) await f.delete();
                }
              } catch (_) {}
              library.removeWhere((e) => e.id == s.id);
              _saveList('lib', library);
              notifyListeners();
            }

            Future<void> download(Song s) async {
              if (s.url == null || downloading.contains(s.id)) return;
              if (library.any((e) => e.id == 'dl:${s.id}')) {
                say('Lagu ini sudah ada di HP.');
                return;
              }
              downloading.add(s.id);
              notifyListeners();
              say('Mengunduh ${s.title}…');
              try {
                final dir = await _musicDir();
                final name = s.id.replaceAll(RegExp(r'[^A-Za-z0-9]'), '_');
                final f = File('${dir.path}/$name.mp3');
                final client = http.Client();
                final res = await client.send(http.Request('GET', Uri.parse(s.url!)));
                if (res.statusCode != 200) throw Exception('HTTP ${res.statusCode}');
                final sink = f.openWrite();
                await res.stream.pipe(sink);
                client.close();
                library.add(Song(
                  id: 'dl:${s.id}',
                  title: s.title,
                  artist: s.artist,
                  album: s.album,
                  art: s.art,
                  path: f.path,
                  durationSec: s.durationSec,
                ));
                _saveList('lib', library);
                say('Tersimpan di HP: ${s.title}');
              } catch (e) {
                say('Gagal mengunduh.');
              }
              downloading.remove(s.id);
              notifyListeners();
            }

            // ---------- jelajahi (Jamendo) ----------
            Future<void> loadTrending() async {
              if (jamendoId.isEmpty) return;
              try {
                trending = await Api.jamendo(jamendoId,
                    order: 'popularity_week', limit: 30);
              } catch (_) {}
              notifyListeners();
            }

            Future<void> search({String? q, String? tag}) async {
              query = q ?? '';
              activeTag = tag;
              if (jamendoId.isEmpty) {
                exploreMsg = 'Isi Jamendo Client ID di Pengaturan dulu.';
                notifyListeners();
                return;
              }
              searching = true;
              exploreMsg = '';
              notifyListeners();
              try {
                final hasQ = q != null && q.trim().isNotEmpty;
                results = await Api.jamendo(jamendoId,
                    search: q,
                    tag: tag,
                    order: hasQ ? 'relevance' : 'popularity_week',
                    limit: 40);
                if (results.isEmpty) exploreMsg = 'Tidak ada hasil.';
              } catch (e) {
                exploreMsg = 'Gagal mencari. Cek internet dan Client ID.';
              }
              searching = false;
              notifyListeners();
            }

            // ---------- lirik ----------
            Future<void> loadLyrics(Song s) async {
              lyr = [];
              plainLyr = null;
              lyrMsg = '';
              final key = 'lyr:${s.id}';
              final cached = prefs.getString(key);
              if (cached != null) {
                _applyLyr(cached);
                lyrLoading = false;
                notifyListeners();
                return;
              }
              lyrLoading = true;
              notifyListeners();
              String? txt;
              bool failed = false;
              try {
                txt = await Api.lyrics(s);
              } catch (_) {
                failed = true;
              }
              if (current?.id != s.id) return;
              if (txt != null) {
                await prefs.setString(key, txt);
                _applyLyr(txt);
              } else {
                lyrMsg = failed
                    ? 'Gagal memuat lirik. Cek internet.'
                    : 'Lirik tidak ditemukan.';
              }
              lyrLoading = false;
              notifyListeners();
            }

            void _applyLyr(String t) {
              final l = parseLrc(t);
              if (l.isNotEmpty) {
                lyr = l;
              } else {
                plainLyr = t;
              }
            }
