                          st.say('Client ID disimpan.');
                        },
                        child: const Text('Simpan'),
                      ),
                      const SizedBox(height: 24),
                      Text('Tentang', style: head(st, 18)),
                      const SizedBox(height: 6),
                      const Text(
                          'Irfah 1.0. Lirik dari LRCLIB. Lagu online dari Jamendo. Lagu dari HP dan unduhan disimpan di penyimpanan aplikasi dan bisa diputar offline.'),
                    ]),
                  ),
                ),
              );
            }
          }
          DART_EOF
          cat > lib/player_page.dart <<'DART_EOF'
          import 'dart:math';

          import 'package:flutter/material.dart';
          import 'package:just_audio/just_audio.dart';

          import 'pages.dart';
          import 'state.dart';

          Future<void> openPlayer(BuildContext context, AppState st) {
            return Navigator.of(context).push(PageRouteBuilder(
              pageBuilder: (_, __, ___) => PlayerPage(st),
              transitionsBuilder: (_, a, __, child) => SlideTransition(
                position: Tween<Offset>(begin: const Offset(0, 1), end: Offset.zero)
                    .animate(CurvedAnimation(parent: a, curve: Curves.easeOutCubic)),
                child: child,
              ),
            ));
          }

          class PlayerPage extends StatefulWidget {
            final AppState st;
            const PlayerPage(this.st, {super.key});

            @override
            State<PlayerPage> createState() => _PlayerState();
          }

          class _PlayerState extends State<PlayerPage> {
            bool showLyrics = false;
            final ScrollController sc = ScrollController();
            int _last = -1;
            String? _lastId;

            @override
            void dispose() {
              sc.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final st = widget.st;
              return ListenableBuilder(
                listenable: st,
                builder: (context, _) {
                  final s = st.current;
                  final primary = Theme.of(context).colorScheme.primary;
                  return Backdrop(
                    st: st,
                    child: Scaffold(
                      backgroundColor: Colors.transparent,
                      appBar: AppBar(
                        backgroundColor: Colors.transparent,
                        leading: IconButton(
                          icon: const Icon(Icons.keyboard_arrow_down, size: 32),
                          onPressed: () => Navigator.of(context).pop(),
                        ),
                        title: const Text('Sedang diputar'),
                        centerTitle: true,
                        actions: [
                          PopupMenuButton<int>(
                            icon: Icon(st.sleepMin > 0 ? Icons.bedtime : Icons.bedtime_outlined),
                            tooltip: 'Timer tidur',
                            onSelected: st.setSleep,
                            itemBuilder: (_) => const [
                              PopupMenuItem(value: 0, child: Text('Timer tidur: mati')),
                              PopupMenuItem(value: 15, child: Text('15 menit')),
                              PopupMenuItem(value: 30, child: Text('30 menit')),
                              PopupMenuItem(value: 60, child: Text('60 menit')),
                            ],
                          ),
                        ],
                      ),
                      body: s == null
                          ? const Center(child: Text('Belum ada lagu'))
                          : SafeArea(
                              child: Padding(
                                padding: const EdgeInsets.symmetric(horizontal: 24),
                                child: Column(children: [
                                  Expanded(
                                    child: showLyrics
                                        ? _lyrics(st, context)
                                        : LayoutBuilder(builder: (c, b) {
                                            final d = min(b.maxWidth, b.maxHeight) * .94;
                                            return Center(
                                              child: Container(
                                                decoration: BoxDecoration(
                                                  borderRadius: BorderRadius.circular(
                                                      st.style == 'glass' ? 30 : 4),
                                                  boxShadow: [
                                                    BoxShadow(
                                                        color: primary.withAlpha(110),
                                                        blurRadius: 40,
                                                        offset: const Offset(0, 16)),
                                                  ],
                                                ),
                                                child: Cover(
                                                    s: s,
                                                    size: d,
                                                    radius: st.style == 'glass' ? 30 : 4),
                                              ),
                                            );
                                          }),
                                  ),
                                  const SizedBox(height: 16),
                                  Row(children: [
                                    Expanded(
                                      child: Column(
                                          crossAxisAlignment: CrossAxisAlignment.start,
                                          children: [
                                            Text(s.title,
                                                maxLines: 1,
                                                overflow: TextOverflow.ellipsis,
                                                style: head(st, 22)),
                                            const SizedBox(height: 2),
                                            Text(s.artist.isEmpty ? '—' : s.artist,
                                                maxLines: 1, overflow: TextOverflow.ellipsis),
                                          ]),
                                    ),
                                    IconButton(
                                      icon: Icon(st.isFav(s) ? Icons.favorite : Icons.favorite_border,
                                          color: st.isFav(s) ? primary : null),
                                      onPressed: () => st.toggleFav(s),
                                    ),
                                  ]),
                                  _seek(st),
                                  _controls(st, primary),
                                  Row(mainAxisAlignment: MainAxisAlignment.spaceEvenly, children: [
                                    TextButton.icon(
                                      onPressed: () => setState(() => showLyrics = !showLyrics),
                                      icon: Icon(showLyrics ? Icons.album : Icons.lyrics_outlined),
                                      label: Text(showLyrics ? 'Sampul' : 'Lirik'),
                                    ),
                                    if (!s.isLocal)
                                      TextButton.icon(
                                        onPressed: st.downloading.contains(s.id)
                                            ? null
                                            : () => st.download(s),
                                        icon: const Icon(Icons.download_outlined),
                                        label: Text(st.downloading.contains(s.id)
                                            ? 'Mengunduh…'
                                            : 'Unduh'),
                                      ),
                                  ]),
                                  const SizedBox(height: 8),
                                ]),
                              ),
                            ),
                    ),
                  );
                },
              );
            }

            Widget _seek(AppState st) {
              return StreamBuilder<Duration?>(
                stream: st.player.durationStream,
                builder: (context, ds) {
                  final dur = ds.data ?? Duration.zero;
                  return StreamBuilder<Duration>(
                    stream: st.player.positionStream,
                    builder: (context, ps) {
                      final pos = ps.data ?? Duration.zero;
                      final m = dur.inMilliseconds > 0 ? dur.inMilliseconds.toDouble() : 1.0;
                      final v = pos.inMilliseconds.toDouble().clamp(0.0, m).toDouble();
                      return Column(children: [
                        Slider(
                          value: v,
                          max: m,
                          onChanged: dur.inMilliseconds > 0
                              ? (x) => st.player.seek(Duration(milliseconds: x.toInt()))
                              : null,
                        ),
                        Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 16),
                          child: Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [Text(fmt(pos)), Text(fmt(dur))]),
                        ),
                      ]);
                    },
                  );
                },
              );
            }

            Widget _controls(AppState st, Color primary) {
              return Row(mainAxisAlignment: MainAxisAlignment.spaceEvenly, children: [
                IconButton(
                  icon: Icon(Icons.shuffle, color: st.shuffle ? primary : null),
                  onPressed: () => st.toggleShuffle(),
                ),
                IconButton(
                  iconSize: 38,
                  icon: const Icon(Icons.skip_previous),
                  onPressed: () => st.prev(),
                ),
                StreamBuilder<PlayerState>(
                  stream: st.player.playerStateStream,
                  builder: (context, snap) {
                    final playing = snap.data?.playing ?? false;
                    return IconButton.filled(
                      iconSize: 42,
                      icon: Icon(playing ? Icons.pause : Icons.play_arrow),
                      onPressed: () => st.togglePlay(),
                    );
                  },
                ),
                IconButton(
                  iconSize: 38,
                  icon: const Icon(Icons.skip_next),
                  onPressed: () => st.next(),
                ),
                IconButton(
                  icon: Icon(st.repeat == 2 ? Icons.repeat_one : Icons.repeat,
                      color: st.repeat == 0 ? null : primary),
                  onPressed: () => st.cycleRepeat(),
                ),
              ]);
            }

            Widget _lyrics(AppState st, BuildContext context) {
              if (_lastId != st.current?.id) {
                _lastId = st.current?.id;
                _last = -1;
              }
              if (st.lyrLoading) return const Center(child: CircularProgressIndicator());
              if (st.lyr.isNotEmpty) {
                final onSurface = Theme.of(context).colorScheme.onSurface;
                return StreamBuilder<Duration>(
                  stream: st.player.positionStream,
                  builder: (context, ps) {
                    final pos = ps.data ?? Duration.zero;
                    int a = -1;
                    for (int i = 0; i < st.lyr.length; i++) {
                      if (st.lyr[i].t <= pos) {
                        a = i;
                      } else {
                        break;
                      }
                    }
                    _scrollTo(a);
                    return ListView.builder(
                      controller: sc,
                      itemExtent: 60,
                      padding: const EdgeInsets.symmetric(vertical: 120),
                      itemCount: st.lyr.length,
                      itemBuilder: (context, i) {
                        final on = i == a;
                        return GestureDetector(
                          onTap: () => st.player.seek(st.lyr[i].t),
                          child: Align(
                            alignment: Alignment.centerLeft,
                            child: AnimatedDefaultTextStyle(
                              duration: const Duration(milliseconds: 220),
                              maxLines: 2,
                              overflow: TextOverflow.ellipsis,
                              style: TextStyle(
                                fontSize: on ? 24 : 20,
                                fontWeight: FontWeight.w800,
                                color: onSurface.withAlpha(on ? 255 : 110),
                              ),
                              child: Text(st.lyr[i].text.isEmpty ? '♪' : st.lyr[i].text),
                            ),
                          ),
                        );
                      },
                    );
                  },
                );
              }
              if (st.plainLyr != null) {
                return SingleChildScrollView(
                  child: Text(st.plainLyr!, style: const TextStyle(fontSize: 18, height: 1.5)),
                );
              }
              return Center(
                  child: Text(st.lyrMsg.isEmpty ? 'Lirik tidak tersedia.' : st.lyrMsg));
            }

            void _scrollTo(int a) {
              if (a == _last || a < 0 || !sc.hasClients) return;
              _last = a;
              final target = (120 + a * 60.0 + 30 - sc.position.viewportDimension / 2)
                  .clamp(0.0, sc.position.maxScrollExtent)
                  .toDouble();
              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (sc.hasClients) {
                  sc.animateTo(target,
                      duration: const Duration(milliseconds: 350), curve: Curves.easeOut);
                }
              });
            }
          }
          DART_EOF

      - name: Buat kerangka Android
        run: |
          flutter create --platforms=android --project-name irfah --org com.irfah /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android

      - name: Atur Android untuk musik latar belakang
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
          )
          s = s.replace('<application', perms + '    <application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Irfah"', s, count=1)
          s = s.replace('android:name=".MainActivity"', 'android:name="com.ryanheise.audioservice.AudioServiceActivity"')
          svc = (
              '        <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true" tools:ignore="Instantiatable">\n'
              '            <intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter>\n'
              '        </service>\n'
              '        <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true" tools:ignore="Instantiatable">\n'
              '            <intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter>\n'
              '        </receiver>\n'
          )
          s = s.replace('</application>', svc + '    </application>', 1)
          p.write_text(s)
          print(s)
          PY

